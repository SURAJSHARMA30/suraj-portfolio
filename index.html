  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        function hideBolt() {
          try {
            function checkAndHide(el) {
              if (el && el.textContent && el.textContent.trim() === 'Made in Bolt') {
                var parent = el;
                for (var j = 0; j < 5; j++) {
                  if (parent.parentElement && parent.parentElement !== document.body && parent.parentElement !== document.documentElement) {
                    parent = parent.parentElement;
                  } else {
                    break;
                  }
                }
                if (parent) {
                  parent.style.setProperty('display', 'none', 'important');
                  parent.style.setProperty('visibility', 'hidden', 'important');
                  parent.style.setProperty('opacity', '0', 'important');
                  parent.style.setProperty('pointer-events', 'none', 'important');
                }
              }
            }

            function traverse(root) {
              if (!root) return;
              var elements = root.querySelectorAll('*');
              for (var i = 0; i < elements.length; i++) {
                var el = elements[i];
                checkAndHide(el);
                if (el.shadowRoot) {
                  if (el.shadowRoot.textContent && el.shadowRoot.textContent.indexOf('Bolt') !== -1) {
                    el.style.setProperty('display', 'none', 'important');
                    el.style.setProperty('visibility', 'hidden', 'important');
                  }
                  traverse(el.shadowRoot);
                }
              }
            }

            traverse(document);

            var selectors = [
              'sb-badge', 'bolt-badge', 'stackblitz-badge',
              '[class*="sb-badge"]', '[id*="sb-badge"]',
              '[class*="bolt-badge"]', '[id*="bolt-badge"]',
              '[class*="made-in-bolt"]', '[id*="made-in-bolt"]'
            ];
            for (var k = 0; k < selectors.length; k++) {
              var badges = document.querySelectorAll(selectors[k]);
              for (var m = 0; m < badges.length; m++) {
                badges[m].style.setProperty('display', 'none', 'important');
                badges[m].style.setProperty('visibility', 'hidden', 'important');
                badges[m].style.setProperty('opacity', '0', 'important');
              }
            }
          } catch(e) {}
        }
        hideBolt();
        setInterval(hideBolt, 100);
      })();
    </script>
  </body>
</html>
